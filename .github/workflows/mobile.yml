name: Mobile

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'packages/shared-types/**'
      - 'packages/validation/**'
      - 'packages/api-client/**'
      - 'packages/shared-utils/**'
      - 'package-lock.json'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'packages/shared-types/**'
      - 'packages/validation/**'
      - 'packages/api-client/**'
      - 'packages/shared-utils/**'
      - 'package-lock.json'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHECKPOINT_DISABLE: '1'
  NEXT_TELEMETRY_DISABLED: '1'

# Ships through EAS (mobile/eas.json), not a server.
jobs:
  test-and-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci -w @walktogether/mobile
      - run: npm run typecheck -w @walktogether/mobile
      - run: npm run test -w @walktogether/mobile
      - name: Android JS bundle compiles
        run: npm run bundle:check -w @walktogether/mobile
