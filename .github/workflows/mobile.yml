name: Mobile

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'packages/shared-types/**'
      - 'packages/validation/**'
      - 'packages/api-client/**'
      - 'packages/gps/**'
      - 'packages/shared-utils/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'packages/shared-types/**'
      - 'packages/validation/**'
      - 'packages/api-client/**'
      - 'packages/gps/**'
      - 'packages/shared-utils/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHECKPOINT_DISABLE: '1'
  NEXT_TELEMETRY_DISABLED: '1'

# Ships through EAS (mobile/eas.json), not a server.
jobs:
  test-and-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter @walktogether/mobile...
      - run: pnpm --filter @walktogether/mobile typecheck
      - run: pnpm --filter @walktogether/mobile test
      - name: Android JS bundle compiles
        run: pnpm --filter @walktogether/mobile bundle:check
