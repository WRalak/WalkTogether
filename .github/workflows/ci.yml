name: Shared checks

# Repository-wide checks. Each deployable folder also has its own workflow
# (server.yml, platform-admin.yml, mobile.yml) that runs
# only when that folder or a shared package it uses changes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: shared-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHECKPOINT_DISABLE: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  typecheck-and-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - name: Typecheck every workspace
        run: npm run typecheck
      - name: Shared package tests
        run: |
          npm run test -w @walktogether/validation
          npm run test -w @walktogether/shared-utils
          npm run test -w @walktogether/api-client

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans every commit in the push, so it needs the history, not just the tip.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Dependency vulnerability scan (production deps)
        run: npm run audit:prod
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

