name: Shared checks

# Repository-wide checks. Each deployable folder also has its own workflow
# (server.yml, website.yml, club-admin.yml, platform-admin.yml, mobile.yml) that runs
# only when that folder or a shared package it uses changes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: shared-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHECKPOINT_DISABLE: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  typecheck-and-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @walktogether/server exec prisma generate
      - name: Typecheck every workspace
        run: pnpm -r --parallel typecheck
      - name: Shared package tests
        run: |
          pnpm --filter @walktogether/validation test
          pnpm --filter @walktogether/shared-utils test
          pnpm --filter @walktogether/gps test
          pnpm --filter @walktogether/api-client test

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Dependency vulnerability scan (production deps)
        run: pnpm audit --prod --audit-level high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

