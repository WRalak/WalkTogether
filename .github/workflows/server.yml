name: API server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'packages/shared-types/**'
      - 'packages/validation/**'
      - 'packages/shared-utils/**'
      - 'package-lock.json'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'packages/shared-types/**'
      - 'packages/validation/**'
      - 'packages/shared-utils/**'
      - 'package-lock.json'
      - '.github/workflows/server.yml'
  workflow_dispatch:

concurrency:
  group: api-server-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHECKPOINT_DISABLE: '1'
  NEXT_TELEMETRY_DISABLED: '1'

# Deploys independently: one Docker image (server/Dockerfile) run as API, worker and migrate job.
jobs:
  server-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: walktogether
          POSTGRES_PASSWORD: walktogether
          POSTGRES_DB: walktogether_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U walktogether" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci -w @walktogether/server
      - run: npm run db:generate
      - name: Install ffmpeg (video pipeline tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: API, auth, authorization & tenant-isolation tests
        run: npm run test -w @walktogether/server
      - name: Migration drift check (schema.prisma vs migrations)
        working-directory: server
        run: |
          PGPASSWORD=walktogether psql -h localhost -U walktogether -d walktogether_test -c 'CREATE DATABASE walktogether_shadow'
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://walktogether:walktogether@localhost:5432/walktogether_shadow --exit-code

  image:
    runs-on: ubuntu-latest
    needs: [server-integration]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          load: true
          tags: walktogether-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Smoke-test API image (boots and refuses unsafe production config)
        run: |
          set +e
          out=$(docker run --rm -e NODE_ENV=production -e DATABASE_URL=postgresql://x:y@localhost/db \
            -e JWT_ACCESS_SECRET=$(openssl rand -hex 32) -e JWT_ADMIN_SECRET=$(openssl rand -hex 32) \
            -e TOKEN_HASH_SECRET=$(openssl rand -hex 32) -e ENCRYPTION_KEY=$(openssl rand -base64 32) walktogether-api:ci 2>&1)
          echo "$out" | tail -20
          echo "$out" | grep -q "Unsafe production configuration" || { echo "expected the configuration guard to refuse start"; exit 1; }
