name: Club admin

on:
  push:
    branches: [main]
    paths:
      - 'club-admin/**'
      - 'packages/**'
      - '!packages/gps/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/club-admin.yml'
      - '.github/workflows/next-app.yml'
  pull_request:
    paths:
      - 'club-admin/**'
      - 'packages/**'
      - '!packages/gps/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/club-admin.yml'
      - '.github/workflows/next-app.yml'
  workflow_dispatch:

concurrency:
  group: club-admin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHECKPOINT_DISABLE: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  app:
    uses: ./.github/workflows/next-app.yml
    with:
      app: club-admin
