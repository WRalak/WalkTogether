name: Platform admin

on:
  push:
    branches: [main]
    paths:
      - 'platform-admin/**'
      - 'packages/**'
      - 'package-lock.json'
      - '.github/workflows/platform-admin.yml'
  pull_request:
    paths:
      - 'platform-admin/**'
      - 'packages/**'
      - 'package-lock.json'
      - '.github/workflows/platform-admin.yml'
  workflow_dispatch:

concurrency:
  group: platform-admin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHECKPOINT_DISABLE: '1'
  NEXT_TELEMETRY_DISABLED: '1'

# Deploys independently: Vercel (platform-admin/vercel.json) or platform-admin/Dockerfile.
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci -w @walktogether/platform-admin
      - run: npm run typecheck -w @walktogether/platform-admin
      - run: npm run test -w @walktogether/platform-admin
      - run: npm run build -w @walktogether/platform-admin

  image:
    runs-on: ubuntu-latest
    needs: [test-and-build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build platform-admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: platform-admin/Dockerfile
          push: false
          tags: walktogether-platform-admin:ci
          cache-from: type=gha,scope=platform-admin
          cache-to: type=gha,mode=max,scope=platform-admin
