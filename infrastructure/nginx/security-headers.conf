# Security headers shared by every TLS server block (include inside `server { }`).
# The API also sets these via Helmet; setting them at the edge protects error pages and anything
# served before the app (e.g. 502 pages) too. `always` applies them to error responses as well.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
# Never let shared caches store personalised API responses.
add_header Cache-Control "no-store" always;
