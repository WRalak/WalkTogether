# Reference Nginx reverse proxy (used by infrastructure/docker/docker-compose.yml; on AWS the ALB
# terminates TLS and this file is not needed). Hostnames: api.walktogether.app (API + email-link and
# legal pages) and admin.walktogether.app (platform admin). Members and club administrators use the
# mobile app; there is no public website. PostgreSQL and Redis are never published through here.

worker_processes auto;
events { worker_connections 2048; }

http {
  server_tokens off;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 30s;
  client_max_body_size 2m;           # API JSON limit is 1 MB; media goes straight to object storage
  client_body_timeout 15s;
  client_header_timeout 15s;
  large_client_header_buffers 4 16k;

  # JSON access log without query strings (tokens in email links must not be logged).
  # nosemgrep: request-host-used -- logged value only, JSON-escaped
  log_format json escape=json '{"time":"$time_iso8601","ip":"$remote_addr","host":"$host","method":"$request_method",'
    '"path":"$uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"ua":"$http_user_agent","rid":"$request_id"}';
  access_log /var/log/nginx/access.log json;

  limit_req_zone $binary_remote_addr zone=api_per_ip:20m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=admin_per_ip:10m rate=5r/s;
  limit_req_status 429;
  # Only WebSocket upgrades are forwarded; any other Upgrade value (e.g. h2c) is dropped, which
  # prevents HTTP/2-cleartext request smuggling past this proxy.
  map $http_upgrade $ws_upgrade { ~*^websocket$ websocket; default ''; }
  map $ws_upgrade $connection_upgrade { websocket upgrade; default close; }

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;
  ssl_stapling on;
  ssl_stapling_verify on;
  ssl_certificate /etc/letsencrypt/live/walktogether.app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/walktogether.app/privkey.pem;

  upstream wt_api { server api:4000; keepalive 32; }
  upstream wt_platform_admin { server platform-admin:3000; }

  # Plain HTTP only serves ACME challenges and redirects.
  server {
    listen 80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 444; }
  }
  server {
    listen 80;
    server_name api.walktogether.app;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://api.walktogether.app$request_uri; }
  }
  server {
    listen 80;
    server_name admin.walktogether.app;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://admin.walktogether.app$request_uri; }
  }

  # Load-balancer health check (AWS ALB). Port 8080 is reachable only from the ALB security group
  # (infrastructure/terraform/modules/compute); it exposes nothing but the API liveness result.
  server {
    listen 8080;
    server_name _;
    access_log off;
    location = /alb-health { proxy_pass http://wt_api/health/live; }
    location / { return 404; }
  }

  # Unknown hostnames are refused rather than routed to an app.
  server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    return 444;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name api.walktogether.app;
    include /etc/nginx/security-headers.conf;

    location / {
      limit_req zone=api_per_ip burst=40 nodelay;
      proxy_pass http://wt_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host; # nosemgrep: request-host-used -- $host can only be this server_name (unknown hosts hit the 444 default_server)
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header Connection "";
      proxy_read_timeout 35s;
    }
    location /rt/ {
      proxy_pass http://wt_api;
      # nosemgrep: possible-nginx-h2c-smuggling -- mitigated: $ws_upgrade only ever forwards "websocket" (map above)
      proxy_http_version 1.1;
      proxy_set_header Upgrade $ws_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 120s;
    }
    location /socket.io/ {
      proxy_pass http://wt_api;
      # nosemgrep: possible-nginx-h2c-smuggling -- mitigated: $ws_upgrade only ever forwards "websocket" (map above)
      proxy_http_version 1.1;
      proxy_set_header Upgrade $ws_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 120s;
    }
    # Internal endpoints are not exposed publicly (Prometheus scrapes the API on the private network).
    location = /metrics { return 404; }
    location /api/docs { return 404; }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name admin.walktogether.app;
    include /etc/nginx/security-headers.conf;
    # Defence in depth: restrict the platform admin to office / VPN ranges in addition to MFA.
    # allow 203.0.113.0/24;
    # deny all;
    location / {
      limit_req zone=admin_per_ip burst=20 nodelay;
      proxy_pass http://wt_platform_admin;
      proxy_set_header Host $host; # nosemgrep: request-host-used -- $host can only be this server_name (unknown hosts hit the 444 default_server)
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
