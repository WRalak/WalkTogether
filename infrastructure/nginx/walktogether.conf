# Reference Nginx reverse-proxy configuration (TLS terminated here or at a managed load balancer).
# Hostnames: api.walktogether.app (API + email-link/legal pages) and admin.walktogether.app
# (platform admin). Members and club administrators use the mobile app; there is no public website.

limit_req_zone $binary_remote_addr zone=api_per_ip:20m rate=20r/s;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream wt_api { server api:4000; keepalive 32; }
upstream wt_platform_admin { server platform-admin:3000; }

server {
  listen 80;
  server_name admin.walktogether.app api.walktogether.app;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

# Shared TLS settings
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
server_tokens off;
client_max_body_size 2m;

server {
  listen 443 ssl;
  http2 on;
  server_name api.walktogether.app;
  ssl_certificate /etc/letsencrypt/live/walktogether.app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/walktogether.app/privkey.pem;

  location / {
    limit_req zone=api_per_ip burst=40 nodelay;
    proxy_pass http://wt_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 35s;
  }
  # Socket.IO (Phase 5)
  location /socket.io/ {
    proxy_pass http://wt_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  # API docs are not exposed publicly in production.
  location /api/docs { return 404; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name admin.walktogether.app;
  ssl_certificate /etc/letsencrypt/live/walktogether.app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/walktogether.app/privkey.pem;
  # Defence in depth: restrict the platform admin to the office/VPN ranges in addition to MFA.
  # allow 203.0.113.0/24;
  # deny all;
  location / { proxy_pass http://wt_platform_admin; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
}
