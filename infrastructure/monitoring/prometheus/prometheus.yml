# Prometheus scrape configuration. Prometheus runs on the private network only; the API's /metrics is
# blocked at the edge (nginx returns 404) and both endpoints require the METRICS_TOKEN bearer token,
# mounted from the secrets manager as a file (never inline here).
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels: { platform: walktogether }

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs: [{ targets: ['alertmanager:9093'] }]

scrape_configs:
  - job_name: walktogether-api
    authorization: { type: Bearer, credentials_file: /run/secrets/metrics_token }
    static_configs: [{ targets: ['api:4000'] }]
  - job_name: walktogether-worker
    authorization: { type: Bearer, credentials_file: /run/secrets/metrics_token }
    static_configs: [{ targets: ['worker:9464'] }]
  # Host and database exporters (node_exporter, postgres_exporter / CloudWatch exporter) are deployed
  # by infrastructure/terraform; RDS and ElastiCache also have CloudWatch alarms there.
  - job_name: node
    static_configs: [{ targets: ['node-exporter:9100'] }]
