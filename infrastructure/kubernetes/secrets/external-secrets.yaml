# Secrets are pulled from AWS Secrets Manager by External Secrets Operator (IRSA-scoped to
# walktogether/<env>/*). No secret values are ever stored in this repository.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: walktogether
spec:
  provider:
    aws:
      service: SecretsManager
      region: af-south-1
      auth:
        jwt:
          serviceAccountRef: { name: external-secrets-reader }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: walktogether-api
  namespace: walktogether
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: SecretStore }
  target:
    name: walktogether-api
    creationPolicy: Owner
  dataFrom:
    - extract: { key: walktogether/production/api }
