# Workspace members (mirrors "workspaces" in package.json; pnpm reads this file).
# Every application lives at the repository root — there is no apps/ directory.
packages:
  - "server"
  - "platform-admin"
  - "mobile"
  - "packages/*"

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - argon2
  - esbuild
  - prisma
  - sharp
  - unrs-resolver
